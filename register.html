<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Registration | Football Talent Hub</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init({
            publicKey: "YOUR_EMAILJS_PUBLIC_KEY", // Replace with your actual EmailJS Public Key
          });
       })();
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-black tracking-wider text-emerald-400">TCS</span>
                <span class="text-lg font-bold text-slate-200">Talent Hub</span>
            </div>
            <nav class="flex items-center space-x-6">
                <a href="index.html" class="text-slate-400 hover:text-slate-200 font-medium">Home</a>
                <a href="register.html" class="text-emerald-400 font-medium">Register Player</a>
            </nav>
        </div>
    </header>

    <!-- Registration Form Section -->
    <main class="flex-grow max-w-3xl mx-auto px-4 py-12 w-full">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
            <h1 class="text-3xl font-black tracking-tight mb-2">Player Registration CV</h1>
            <p class="text-slate-400 text-sm mb-8">Fill out your football credentials below to submit your dossier for administrative verification.</p>

            <form id="registration-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Full Name</label>
                        <input type="text" id="fullName" required placeholder="e.g. Samuel Mensah" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Email Address</label>
                        <input type="email" id="email" required placeholder="e.g. samuel@example.com" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">WhatsApp Phone Number</label>
                        <input type="tel" id="phone" required placeholder="e.g. +233241234567" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Primary Position</label>
                        <select id="position" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                            <option value="">Select Position</option>
                            <option value="Center-Back (CB)">Center-Back (CB)</option>
                            <option value="Full-Back (LB/RB)">Full-Back (LB/RB)</option>
                            <option value="Central Midfielder (CM)">Central Midfielder (CM)</option>
                            <option value="Winger (LW/RW)">Winger (LW/RW)</option>
                            <option value="Striker / Center-Forward (ST)">Striker / Center-Forward (ST)</option>
                            <option value="Goalkeeper (GK)">Goalkeeper (GK)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Age</label>
                        <input type="number" id="age" required min="14" max="35" placeholder="e.g. 19" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Preferred Foot</label>
                        <select id="preferredFoot" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                            <option value="Right">Right</option>
                            <option value="Left">Left</option>
                            <option value="Both">Both</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Height</label>
                        <input type="text" id="height" required placeholder="e.g. 184 cm" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Nationality</label>
                        <input type="text" id="nationality" required placeholder="e.g. Ghanaian" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Player Photo (Local Device)</label>
                        <input type="file" id="photoFile" accept="image/*" 
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-600 transition cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Highlight Video Link (YouTube / Hudl / Drive)</label>
                    <input type="url" id="highlightVideoUrl" placeholder="https://youtube.com/..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Player Bio / Tactical Strengths</label>
                    <textarea id="bio" rows="3" placeholder="Briefly describe your playing style, club history, or strengths..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition"></textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/20 text-lg">
                    Submit Player Registration
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-sm text-slate-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-center items-center gap-2">
            <p>&copy; 2026 Football Talent Hub. All rights reserved.</p>
            <span class="hidden md:inline text-slate-700">|</span>
            <p class="text-slate-400">
                Support: 
                <a href="https://wa.me/233531919451" target="_blank" class="text-emerald-400 font-medium hover:underline">
                    +233 53 1919 451
                </a> 
                <span class="text-xs text-slate-500">(WhatsApp Only)</span>
            </p>
        </div>
    </footer>

    <!-- Link to our JavaScript file -->
    <script type="module" src="app.js"></script>
</body>
</html>
